name: Continuous Integration

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # Let every Python version finish even if another fails.
      matrix:
        python-version:
          - '3.9'
          - '3.10'
          - '3.11'
          - '3.12'

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Needed to compare type diagnostics against upstream.

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install venv for test suite with Python version ${{ matrix.python-version }}
      run: |
          python3 -m venv venv
          source venv/bin/activate
          python -m pip install poetry>=2.1
          make dev

    - name: Run linting checks
      run: |
          source venv/bin/activate
          make lint

    - name: Run issue #314 regression tests
      run: |
          source venv/bin/activate
          poetry run pytest -q test/issues/test_314.py

    - name: Install tox
      run: |
          source venv/bin/activate
          poetry run python -m pip install "tox>=4.20.0" "tox-gh>=1.4.1"

    - name: Setup test suite
      run: |
          source venv/bin/activate
          tox -vv --notest
    - name: Run test suite
      run: |
          source venv/bin/activate
          tox --skip-pkg-install

    - name: Check for new MyPy errors
      run: |
          source venv/bin/activate
          poetry run python -m pip install 'mypy==1.13.0'
          # Upstream already has many MyPy errors. Detect regressions relative
          # to the exact upstream commit our source patch is based on.
          set +e
          poetry run python -m mypy --no-incremental --python-version 3.9 --ignore-missing-imports pyshacl > "$RUNNER_TEMP/mypy_current.txt" 2>&1
          current_status=$?
          set -e
          if [ "$current_status" -gt 1 ]; then cat "$RUNNER_TEMP/mypy_current.txt"; exit "$current_status"; fi
          cp pyshacl/shapes_graph.py "$RUNNER_TEMP/shapes_graph_patched.py"
          trap 'cp "$RUNNER_TEMP/shapes_graph_patched.py" pyshacl/shapes_graph.py' EXIT
          git show a8ed01e8faa447e73486e77a3969a480c6e08ef4:pyshacl/shapes_graph.py > pyshacl/shapes_graph.py
          set +e
          poetry run python -m mypy --no-incremental --python-version 3.9 --ignore-missing-imports pyshacl > "$RUNNER_TEMP/mypy_baseline.txt" 2>&1
          baseline_status=$?
          set -e
          if [ "$baseline_status" -gt 1 ]; then cat "$RUNNER_TEMP/mypy_baseline.txt"; exit "$baseline_status"; fi
          grep -F ': error:' "$RUNNER_TEMP/mypy_current.txt" | sed -E 's/^([^:]+):[0-9]+(:[0-9]+)?: error:/\1: error:/' | LC_ALL=C sort > "$RUNNER_TEMP/mypy_current_errors.txt"
          grep -F ': error:' "$RUNNER_TEMP/mypy_baseline.txt" | sed -E 's/^([^:]+):[0-9]+(:[0-9]+)?: error:/\1: error:/' | LC_ALL=C sort > "$RUNNER_TEMP/mypy_baseline_errors.txt"
          comm -13 "$RUNNER_TEMP/mypy_baseline_errors.txt" "$RUNNER_TEMP/mypy_current_errors.txt" > "$RUNNER_TEMP/mypy_new_errors.txt"
          echo "Upstream baseline type errors: $(wc -l < "$RUNNER_TEMP/mypy_baseline_errors.txt")"
          echo "Patched code type errors: $(wc -l < "$RUNNER_TEMP/mypy_current_errors.txt")"
          if [ -s "$RUNNER_TEMP/mypy_new_errors.txt" ]; then
            echo 'New type errors introduced by the patch:'
            cat "$RUNNER_TEMP/mypy_new_errors.txt"
            exit 1
          fi
          echo 'No new MyPy errors relative to upstream baseline.'
